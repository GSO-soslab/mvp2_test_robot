mvp2_test_robot/mvp_c2_traffic_control:
  ros__parameters:

    max_frame_size: 100  #maximum size per transmission packet

    # --- Buffer Global Settings ---
    dynamic_buffer:
      max_total_size: 150 # how many dccl message entries will be stored
      overflow_remove_by_time: False
      dccl_intake_message_list: ["Joy", "SetPowerPort", "SetController", "SetHelm", "SetWpt", "RosLaunch"]

    # --- Message Specific Rules ---
    message_rules:
      RosLaunch:
        priority: 10
        ttl_seconds: 100

      SetPowerPort:
        priority: 9
        ttl_seconds: 100

      SetController:
        priority: 8
        ttl_seconds: 100

      SetHelm:
        priority: 7
        ttl_seconds: 100

      SetWpt:
        priority: 6
        ttl_seconds: 100

      Joy:
        priority: 5
        ttl_seconds: 5
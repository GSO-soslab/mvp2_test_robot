finite_state_machine:

  start:
    initial: true
    control_mode: idle
    transitions: [kill, teleop, direct_control, survey]
  
  kill:
    control_mode: idle
    transitions: [start]

  teleop:
    control_mode: teleop
    transitions: [start, kill] 

  direct_control:
    control_mode: teleop
    transitions: [start, kill] 

  # profiling:
  #   control_mode: 4dof
  #   transitions: [start, kill]
  #   set_point_world_frame: world_ned
  #   set_point_child_frame: float_cg_link
    
  survey:
    control_mode: 4dof
    transitions: [start, kill, teleop]

behaviors:

  bhv_teleop:
    plugin: helm/Teleoperation
    priority:
      teleop: 1
  
  bhv_direct_control:
    plugin: helm/DirectControl
    priority:
      direct_control: 1

  # bhv_profiling:
  #   plugin: helm/Bathtub
  #   priority:
  #     profiling: 1

  bhv_path_following:
    plugin: helm/PathFollowing
    priority:
      survey: 1

  bhv_altitude_tracking:
    plugin: helm/AltitudeTracking
    priority: 
      survey: 2